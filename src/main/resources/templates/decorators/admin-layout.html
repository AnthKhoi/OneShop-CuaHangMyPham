<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><sitemesh:write property="title">OneShop Admin - Quản lý chuỗi mỹ phẩm</sitemesh:write></title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom OneShop & Admin Stylesheets -->
    <link rel="stylesheet" th:href="@{/css/oneshop.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">

    <!-- Page Specific Head Injections -->
    <sitemesh:write property="head"/>
</head>
<body class="admin-body">
    <!-- Admin Sidebar -->
    <div th:replace="~{fragments/admin-sidebar :: admin-sidebar}"></div>

    <!-- Admin Main Wrapper -->
    <div class="admin-main">
        <!-- Admin Topbar -->
        <div th:replace="~{fragments/admin-topbar :: admin-topbar}"></div>

        <!-- Admin Content Area -->
        <div class="admin-content">
            <!-- Flash Message Alerts -->
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <!-- Page Body Injected by SiteMesh -->
            <sitemesh:write property="body"/>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/oneshop.js}"></script>
</body>
</html>
