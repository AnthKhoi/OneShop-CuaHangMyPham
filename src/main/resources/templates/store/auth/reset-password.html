<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt Lại Mật Khẩu Mới — OneShop Cosmetics</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/oneshop.css}">
</head>
<body class="bg-light py-5">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <!-- Brand -->
            <div class="text-center mb-4">
                <a th:href="@{/}" class="os-brand justify-content-center">
                    <i class="bi bi-stars"></i> OneShop
                    <span class="badge-tag">BEAUTY</span>
                </a>
                <p class="text-muted mt-2">Hệ thống chuỗi bán lẻ mỹ phẩm chính hãng</p>
            </div>

            <!-- Card -->
            <div class="bg-white p-4 p-md-5 rounded-4 border shadow-sm mb-4">
                <div class="text-center mb-4">
                    <div class="d-inline-flex p-3 rounded-circle bg-success bg-opacity-10 text-success mb-3">
                        <i class="bi bi-check2-circle fs-1"></i>
                    </div>
                    <h4 class="fw-bold m-0">Đặt mật khẩu mới</h4>
                    <p class="text-muted small mt-2">
                        Tài khoản: <strong class="text-dark" th:text="${email}">email@example.com</strong>
                    </p>
                </div>

                <!-- Alert Messages -->
                <div th:if="${errorMessage}" class="alert alert-danger py-2 small" th:text="${errorMessage}"></div>

                <form th:action="@{/auth/reset-password}" method="post">
                    <input type="hidden" name="email" th:value="${email}">
                    <input type="hidden" name="token" th:value="${token}">

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Mật khẩu mới</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                            <input type="password" name="password" class="form-control"
                                   placeholder="Tối thiểu 6 ký tự" minlength="6" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-bold">Xác nhận mật khẩu mới</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-lock-fill"></i></span>
                            <input type="password" name="confirmPassword" class="form-control"
                                   placeholder="Nhập lại mật khẩu mới" minlength="6" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-os-primary btn-lg w-100 py-3 fw-bold mb-3">
                        <i class="bi bi-check-lg me-1"></i> Lưu mật khẩu & Đăng nhập
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
