<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên Mật Khẩu — OneShop Cosmetics</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/oneshop.css}">
</head>
<body class="bg-light py-5">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <!-- Brand -->
            <div class="text-center mb-4">
                <a th:href="@{/}" class="os-brand justify-content-center">
                    <i class="bi bi-stars"></i> OneShop
                    <span class="badge-tag">BEAUTY</span>
                </a>
                <p class="text-muted mt-2">Hệ thống chuỗi bán lẻ mỹ phẩm chính hãng</p>
            </div>

            <!-- Forgot Password Card -->
            <div class="bg-white p-4 p-md-5 rounded-4 border shadow-sm mb-4">
                <div class="text-center mb-4">
                    <div class="d-inline-flex p-3 rounded-circle bg-danger bg-opacity-10 text-danger mb-3">
                        <i class="bi bi-key-fill fs-1"></i>
                    </div>
                    <h4 class="fw-bold m-0">Quên mật khẩu?</h4>
                    <p class="text-muted small mt-2">
                        Nhập địa chỉ email tài khoản của bạn để nhận mã xác thực OTP khôi phục mật khẩu.
                    </p>
                </div>

                <!-- Alert Messages -->
                <div th:if="${errorMessage}" class="alert alert-danger py-2 small" th:text="${errorMessage}"></div>
                <div th:if="${successMessage}" class="alert alert-success py-2 small" th:text="${successMessage}"></div>

                <form th:action="@{/auth/forgot-password}" method="post">
                    <div class="mb-4">
                        <label class="form-label small fw-bold">Địa chỉ Email đăng ký</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                            <input type="email" name="email" class="form-control" placeholder="example@gmail.com" required autofocus>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-os-primary btn-lg w-100 py-3 fw-bold mb-3">
                        <i class="bi bi-send me-1"></i> Gửi mã OTP xác nhận
                    </button>
                </form>

                <div class="text-center small">
                    Nhớ lại mật khẩu? <a th:href="@{/auth/login}" class="fw-bold text-danger text-decoration-none">Đăng nhập ngay</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
