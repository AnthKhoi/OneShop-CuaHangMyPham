<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập — OneShop Cosmetics</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/oneshop.css}">
</head>
<body class="bg-light py-5">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <!-- Brand -->
            <div class="text-center mb-4">
                <a th:href="@{/}" class="os-brand justify-content-center">
                    <i class="bi bi-stars"></i> OneShop
                    <span class="badge-tag">BEAUTY</span>
                </a>
                <p class="text-muted mt-2">Hệ thống chuỗi bán lẻ mỹ phẩm chính hãng</p>
            </div>

            <!-- Login Card -->
            <div class="bg-white p-4 p-md-5 rounded-4 border shadow-sm mb-4">
                <h4 class="fw-bold mb-4 text-center">Đăng nhập tài khoản</h4>

                <div th:replace="~{fragments/alerts :: alerts}"></div>

                <form th:action="@{/auth/login}" th:object="${loginRequest}" method="post">
                    <input type="hidden" th:field="*{redirect}">

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Địa chỉ Email</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" id="loginEmail" th:field="*{email}" placeholder="admin@oneshop.vn" required>
                        </div>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>

                    <div class="mb-4">
                        <div class="d-flex justify-content-between align-items-center">
                            <label class="form-label small fw-bold">Mật khẩu</label>
                            <a th:href="@{/auth/forgot-password}" class="small text-danger text-decoration-none">Quên mật khẩu?</a>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="loginPassword" th:field="*{password}" placeholder="••••••••" required>
                        </div>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                    </div>

                    <button type="submit" class="btn btn-os-primary btn-lg w-100 py-3 fw-bold mb-3">
                        Đăng nhập
                    </button>

                    <div class="text-center small">
                        Chưa có tài khoản? <a th:href="@{/auth/register}" class="fw-bold text-danger text-decoration-none">Đăng ký ngay</a>
                    </div>
                </form>
            </div>

            <div class="text-center mt-4">
                <a th:href="@{/}" class="text-muted text-decoration-none small">&laquo; Quay lại trang chủ OneShop</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
