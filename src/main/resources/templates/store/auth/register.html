<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản — OneShop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/oneshop.css}">
</head>
<body class="bg-light py-5">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="text-center mb-4">
                <a th:href="@{/}" class="os-brand justify-content-center">
                    <i class="bi bi-stars"></i> OneShop
                    <span class="badge-tag">BEAUTY</span>
                </a>
                <p class="text-muted mt-2">Tạo tài khoản nhận ưu đãi độc quyền 50.000đ</p>
            </div>

            <div class="bg-white p-4 p-md-5 rounded-4 border shadow-sm mb-4">
                <h4 class="fw-bold mb-4 text-center">Đăng ký thành viên</h4>

                <div th:replace="~{fragments/alerts :: alerts}"></div>

                <form th:action="@{/auth/register}" th:object="${registerRequest}" method="post">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Họ và tên <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" th:field="*{fullName}" placeholder="Nguyễn Thảo My" required>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Địa chỉ Email <span class="text-danger">*</span></label>
                        <input type="email" class="form-control" th:field="*{email}" placeholder="my.nguyen@gmail.com" required>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-sm-6">
                            <label class="form-label small fw-bold">Số điện thoại <span class="text-danger">*</span></label>
                            <input type="tel" class="form-control" th:field="*{phone}" placeholder="0918888999" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                        </div>
                        <div class="col-sm-6">
                            <label class="form-label small fw-bold">Mật khẩu (tối thiểu 6 ký tự) <span class="text-danger">*</span></label>
                            <input type="password" class="form-control" th:field="*{password}" placeholder="••••••••" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-bold">Địa chỉ nhận hàng mặc định</label>
                        <input type="text" class="form-control" th:field="*{address}" placeholder="Số nhà, đường, phường/xã, quận/huyện...">
                    </div>

                    <button type="submit" class="btn btn-os-primary btn-lg w-100 py-3 fw-bold mb-3">
                        Hoàn tất đăng ký
                    </button>

                    <div class="text-center small">
                        Đã có tài khoản? <a th:href="@{/auth/login}" class="fw-bold text-danger text-decoration-none">Đăng nhập</a>
                    </div>
                </form>
            </div>

            <div class="text-center">
                <a th:href="@{/}" class="text-muted text-decoration-none small">&laquo; Quay lại trang chủ OneShop</a>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
