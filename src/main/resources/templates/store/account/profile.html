<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Hồ Sơ Của Tôi — OneShop</title>
</head>
<body>
<div class="container py-4">
    <div class="row g-4">
        <!-- Sidebar Account Nav -->
        <div class="col-md-3">
            <div class="bg-white p-3 rounded-4 border shadow-sm">
                <div class="text-center py-3 border-bottom mb-3">
                    <i class="bi bi-person-circle fs-1 text-danger"></i>
                    <h5 class="fw-bold m-0 mt-2" th:text="${user.fullName}">Tên Khách Hàng</h5>
                    <small class="text-muted" th:text="${user.email}">user@mail.com</small>
                </div>
                <div class="list-group list-group-flush small">
                    <a th:href="@{/account}" class="list-group-item list-group-item-action active fw-bold border-0 rounded-2 py-2 mb-1">
                        <i class="bi bi-person me-2"></i> Thông tin tài khoản
                    </a>
                    <!-- Only show Order History for Customers (not Admin) -->
                    <a th:if="${currentUser == null or !currentUser.isAdmin()}" th:href="@{/account/orders}" class="list-group-item list-group-item-action border-0 rounded-2 py-2 mb-1">
                        <i class="bi bi-receipt me-2"></i> Lịch sử đơn hàng
                    </a>
                    <!-- Admin Shortcut for Admin Account -->
                    <a th:if="${currentUser != null and currentUser.isAdmin()}" th:href="@{/admin}" class="list-group-item list-group-item-action text-danger fw-bold border-0 rounded-2 py-2 mb-1">
                        <i class="bi bi-speedometer2 me-2"></i> Trang quản trị hệ thống
                    </a>
                    <a th:href="@{/auth/logout}" class="list-group-item list-group-item-action text-danger border-0 rounded-2 py-2">
                        <i class="bi bi-box-arrow-right me-2"></i> Đăng xuất
                    </a>
                </div>
            </div>
        </div>

        <!-- Profile Detail -->
        <div class="col-md-9">
            <div class="bg-white p-4 rounded-4 border shadow-sm">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="fw-bold m-0"><i class="bi bi-person-lines-fill text-danger me-2"></i>Hồ sơ cá nhân</h4>
                    <span class="badge bg-danger-subtle text-danger px-3 py-2 rounded-pill small">
                        <i class="bi bi-shield-check me-1"></i>Tài khoản OneShop
                    </span>
                </div>

                <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show rounded-3" role="alert">
                    <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <form th:action="@{/account/update}" method="post">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Họ và tên <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" name="fullName" th:value="${user.fullName}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Email đăng nhập</label>
                            <input type="email" class="form-control bg-light" th:value="${user.email}" readonly disabled>
                            <small class="text-muted" style="font-size: 0.75rem;">Email đăng nhập cố định để bảo mật tài khoản.</small>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Số điện thoại liên hệ</label>
                            <input type="tel" class="form-control" name="phone" th:value="${user.phone}" placeholder="Ví dụ: 0901234567">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Vai trò tài khoản</label>
                            <div class="pt-2">
                                <span class="badge bg-danger px-2 py-1" th:each="r : ${user.roles}" th:text="${r.name.name()}">ROLE</span>
                                <span class="badge bg-secondary px-2 py-1 ms-1" th:if="${user.branch != null}" th:text="${user.branch.name}">Chi nhánh</span>
                            </div>
                        </div>
                        <div class="col-12">
                            <label class="form-label small fw-bold">Địa chỉ nhận hàng mặc định</label>
                            <input type="text" class="form-control" name="address" th:value="${user.address}" placeholder="Ví dụ: 120 Hai Bà Trưng, Phường Bến Nghé, Quận 1, TP. Hồ Chí Minh">
                            <small class="text-muted" style="font-size: 0.78rem;">Địa chỉ này sẽ được tự động áp dụng khi bạn thanh toán đơn hàng.</small>
                        </div>
                        <div class="col-12 mt-4 text-end">
                            <button type="submit" class="btn btn-os-primary px-4 py-2 fw-bold">
                                <i class="bi bi-save me-1"></i> Lưu thông tin tài khoản
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
