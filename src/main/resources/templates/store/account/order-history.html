<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Đơn Hàng Của Tôi — OneShop</title>
</head>
<body>
<div class="container py-4">
    <div class="row g-4">
        <!-- Sidebar Account Nav -->
        <div class="col-md-3">
            <div class="bg-white p-3 rounded-4 border shadow-sm">
                <div class="text-center py-3 border-bottom mb-3">
                    <i class="bi bi-person-circle fs-1 text-danger"></i>
                    <h5 class="fw-bold m-0 mt-2" th:text="${currentUser.fullName}">Tên Khách Hàng</h5>
                    <small class="text-muted" th:text="${currentUser.email}">user@mail.com</small>
                </div>
                <div class="list-group list-group-flush small">
                    <a th:href="@{/account}" class="list-group-item list-group-item-action border-0 rounded-2 py-2 mb-1">
                        <i class="bi bi-person me-2"></i> Thông tin tài khoản
                    </a>
                    <a th:href="@{/account/orders}" class="list-group-item list-group-item-action active fw-bold border-0 rounded-2 py-2 mb-1">
                        <i class="bi bi-receipt me-2"></i> Lịch sử đơn hàng
                    </a>
                    <a th:href="@{/auth/logout}" class="list-group-item list-group-item-action text-danger border-0 rounded-2 py-2">
                        <i class="bi bi-box-arrow-right me-2"></i> Đăng xuất
                    </a>
                </div>
            </div>
        </div>

        <!-- Orders Table -->
        <div class="col-md-9">
            <div class="bg-white p-4 rounded-4 border shadow-sm">
                <h4 class="fw-bold mb-4">Lịch sử đơn hàng</h4>

                <div class="table-responsive" th:if="${not #lists.isEmpty(orders)}">
                    <table class="table align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Mã đơn</th>
                                <th>Ngày đặt</th>
                                <th>Chi nhánh</th>
                                <th>Tổng tiền</th>
                                <th>Trạng thái</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="order : ${orders}">
                                <td>
                                    <strong class="text-danger" th:text="${order.orderCode}">OS-001</strong>
                                </td>
                                <td th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm')}">26/10/2026</td>
                                <td th:text="${order.branch.name}">Chi nhánh</td>
                                <td>
                                    <strong class="text-dark" th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'POINT', 0, 'POINT')} + ' ₫'">0 ₫</strong>
                                </td>
                                <td>
                                    <span class="badge" th:classappend="${order.status.name() == 'COMPLETED' ? 'bg-success' : (order.status.name() == 'CANCELLED' ? 'bg-danger' : 'bg-warning text-dark')}" th:text="${order.status.description}">Trạng thái</span>
                                </td>
                                <td class="text-end">
                                    <a th:href="@{'/account/orders/' + ${order.orderCode}}" class="btn btn-sm btn-outline-dark">
                                        Xem chi tiết
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Empty State -->
                <div class="text-center py-5" th:if="${#lists.isEmpty(orders)}">
                    <i class="bi bi-receipt text-muted" style="font-size: 3.5rem;"></i>
                    <h5 class="fw-bold mt-3">Bạn chưa có đơn hàng nào</h5>
                    <p class="text-muted mb-3">Hãy chọn mua các sản phẩm mỹ phẩm yêu thích nhé!</p>
                    <a th:href="@{/products}" class="btn btn-os-primary btn-sm">Mua sắm ngay</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
