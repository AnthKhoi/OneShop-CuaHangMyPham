<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông Báo Lỗi — OneShop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/oneshop.css}">
</head>
<body class="bg-light py-5">
<div class="container text-center py-5">
    <div class="mb-4">
        <i class="bi bi-exclamation-octagon-fill text-warning" style="font-size: 5rem;"></i>
    </div>
    <h1 class="display-5 fw-bold text-dark mb-2">Đã Xảy Ra Lỗi</h1>
    <p class="lead text-muted mb-4" th:text="${errorMessage != null ? errorMessage : 'Hệ thống đang gặp sự cố tạm thời. Vui lòng thử lại sau.'}">
        Hệ thống đang gặp sự cố tạm thời. Vui lòng thử lại sau.
    </p>
    <div class="d-flex justify-content-center gap-3">
        <a th:href="@{/}" class="btn btn-dark btn-lg px-4"><i class="bi bi-house me-1"></i> Trang chủ</a>
        <a href="javascript:history.back()" class="btn btn-outline-secondary btn-lg px-4"><i class="bi bi-arrow-left me-1"></i> Quay lại trang trước</a>
    </div>
</div>
</body>
</html>
