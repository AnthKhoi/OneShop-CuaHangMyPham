<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Không Tìm Thấy Trang — OneShop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/oneshop.css}">
</head>
<body class="bg-light py-5">
<div class="container text-center py-5">
    <div class="mb-4">
        <i class="bi bi-compass text-danger" style="font-size: 5rem;"></i>
    </div>
    <h1 class="display-4 fw-bold text-dark">404 — Không Tìm Thấy Trang</h1>
    <p class="lead text-muted mb-4" th:text="${errorMessage != null ? errorMessage : 'Trang bạn tìm kiếm không tồn tại hoặc đã được chuyển đi.'}">
        Trang bạn tìm kiếm không tồn tại hoặc đã được chuyển đi.
    </p>
    <div class="d-flex justify-content-center gap-3">
        <a th:href="@{/}" class="btn btn-os-primary btn-lg px-4"><i class="bi bi-house me-1"></i> Trở về Trang chủ</a>
        <a th:href="@{/products}" class="btn btn-outline-dark btn-lg px-4"><i class="bi bi-bag me-1"></i> Xem sản phẩm</a>
    </div>
</div>
</body>
</html>
